# XcodeGen spec. The .xcodeproj is generated from this file and is .gitignored:
#
#   brew install xcodegen && xcodegen generate
#
# Edit this file (and Sources/Info.plist) instead of the generated project.
# No external packages: the app is SwiftUI + URLSession against the Gemini REST API.
name: SahandInfo
options:
  bundleIdPrefix: com.sahandinfo
  # Mirrors the folder layout in Xcode's navigator instead of one flat list.
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  SahandInfo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # Both folders must exist — XcodeGen errors on a missing source path.
      - path: Resources
        excludes:
          - "README.md"
    # NOTE: deliberately no `info:` block. XcodeGen *rewrites* the file named by
    # `info.path`, which would wipe the hand-maintained keys out of Sources/Info.plist.
    # Setting INFOPLIST_FILE below points Xcode at the same file without touching it
    # (XcodeGen also then skips copying Info.plist into the app bundle's resources).
    settings:
      base:
        # Keep this exactly as it was on main, space and all: "Sahand Info".
        # LiveContainer keys each entry by bundle id and remembers the
        # .app path for it, so changing the bundle/executable name between installs leaves the
        # existing entry pointing at a folder that no longer exists - which shows up as a
        # successful install (icon and name are re-read from the new Info.plist) followed by
        # "Could not create process: No such file or directory (errno: 2)" on launch, because
        # the path it spawns nothing. Same reason main has always launched fine here.
        # The Home Screen label is "Sahand Info" either way (CFBundleDisplayName in Info.plist).
        PRODUCT_NAME: "Sahand Info"
        # New identifier on purpose. LiveContainer keys each container entry by bundle id and
        # remembers that entry's .app path; the half-finished install attempt left an entry whose
        # path no longer matches any payload, which is what produced
        # "Could not create process: No such file or directory (errno: 2)" on launch even though
        # the .ipa verified clean in CI. A new id means a brand-new entry with a fresh path, so
        # there is nothing stale to clear out. Nothing in the app reads its own bundle id
        # (no App Groups, no keychain access groups, no push), and note storage keys are explicit
        # strings, so this is safe. Delete the old "Sahand Info" row whenever you like.
        PRODUCT_BUNDLE_IDENTIFIER: com.sahandinfo.notes
        # Settings prints CFBundleShortVersionString/CFBundleVersion straight from the bundle, so
        # LiveContainer's row and the app's own footer can no longer disagree. Bump the marketing
        # version when behavior changes noticeably - it is the quickest way on the phone to tell
        # which build you are holding. Updating under the same bundle id keeps your notes; only a
        # bundle *id* change loses the container's path, which is the trap documented above.
        MARKETING_VERSION: "2.3"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
        # Sources/Info.plist is hand-maintained and is what main used (found automatically by
        # XcodeGen under Sources/), so no INFOPLIST_KEY_* build settings are in play: keys like
        # UILaunchScreen live in the plist file itself.
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
# An explicit shared scheme, so `xcodebuild -scheme SahandInfo` works from CI on a
# freshly generated project without relying on Xcode autocreating one.
schemes:
  SahandInfo:
    build:
      targets:
        SahandInfo: all
    run:
      config: Debug
    archive:
      config: Release
