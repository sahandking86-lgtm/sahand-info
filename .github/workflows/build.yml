name: Build IPA
on:
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project SahandInfo.xcodeproj \
            -scheme SahandInfo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # Cheap regression net: the app icon is the easiest thing to lose silently (it needs the
      # Info.plist keys actool injects). Hard-fails if the executable is missing; reports the
      # rest into the run summary so a "why is there no icon" question has an instant answer.
      - name: Verify app bundle
        run: |
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$app" || { echo "no .app produced"; exit 1; }
          echo "bundle: $app"
          exec_name=$(plutil -extract CFBundleExecutable raw "$app/Info.plist")
          test -f "$app/$exec_name"
          {
            echo "## App bundle"
            echo "- executable: \`$exec_name\`"
            echo "- UILaunchScreen: $(plutil -extract UILaunchScreen json "$app/Info.plist" >/dev/null 2>&1 && echo present || echo MISSING)"
            echo "- app icon wired up: $(plutil -extract CFBundleIcons json "$app/Info.plist" >/dev/null 2>&1 && echo yes || echo 'no (actool did not inject it)')"
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 6 "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          rm -rf Payload SahandInfo.ipa
          mkdir -p Payload
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$app" || { echo "no .app produced"; exit 1; }
          cp -R "$app" Payload/
          # -r with no -y/-9: byte-for-byte the same invocation main uses, so packaging is
          # never a variable when comparing a working main IPA against a branch IPA.
          zip -r SahandInfo.ipa Payload
          rm -rf Payload
          ls -lh SahandInfo.ipa

      # Assert against the shipped archive rather than the build dir: this is literally what a
      # container launcher does (find the .app, read CFBundleExecutable, exec that file). A green
      # run therefore proves the .ipa is launchable-shaped, so any remaining failure is on-device
      # (stale container entry, truncated transfer, iCloud placeholder) and not the package.
      - name: Validate packaged IPA
        run: |
          rm -rf "$RUNNER_TEMP/check" && mkdir -p "$RUNNER_TEMP/check"
          unzip -q SahandInfo.ipa -d "$RUNNER_TEMP/check"
          app=$(find "$RUNNER_TEMP/check/Payload" -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$app" || { echo "::error::no .app inside Payload/ — installers see Unknown.app"; exit 1; }
          exec_name=$(plutil -extract CFBundleExecutable raw "$app/Info.plist")
          test -f "$app/$exec_name" || { echo "::error::$app is missing its executable '$exec_name'"; exit 1; }
          file "$app/$exec_name" | grep -q "Mach-O" || { echo "::error::$exec_name is not a Mach-O binary"; exit 1; }
          test -f "$app/Assets.car" || echo "warning: no compiled asset catalog (no app icon)"
          {
            echo "### Packaged app"
            echo "- bundle: \`$(basename "$app")\`"
            echo "- CFBundleExecutable: \`$exec_name\` (present, Mach-O)"
            echo "- bundle size: $(du -sh "$app" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SahandInfo-ipa
          path: SahandInfo.ipa
          if-no-files-found: error
